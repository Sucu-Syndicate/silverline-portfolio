<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>matheog — homepage</title>
<link rel="stylesheet" href="styles.css" />

<!-- Pinned React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<div id="root"></div>

<!-- Component scripts -->
<script src="terminal-lines.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components/hero.jsx"></script>
<script type="text/babel" src="components/projects.jsx"></script>
<script type="text/babel" src="components/writing.jsx"></script>
<script type="text/babel" src="components/extras.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "heroVariant": "statement",
  "projectsVariant": "index",
  "writingVariant": "bigthree",
  "writingSpeed": 1,
  "easterEggs": true,
  "grain": false,
  "logDensity": "default"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [coordsVisible, setCoordsVisible] = React.useState(false);
  const [changelogOpen, setChangelogOpen] = React.useState(false);

  useScrollReveal();
  useDemolition();

  return (
    <>
      {t.grain && <div className="grain" />}

      <nav className="nav" data-screen-label="00 Nav">
        <a href="#" className="brand">matheog<span style={{ color: 'var(--accent)' }}>.</span></a>
        <ul>
          <li><a href="#writing">Writing</a></li>
          <li><a href="#projects">Work</a></li>
          <li><a href="/about">About</a></li>
          <li><a href="/now">/now</a></li>
        </ul>
      </nav>

      <main>
        <Hero variant={t.heroVariant} showCoords={coordsVisible} />
        <ProjectsSection variant={t.projectsVariant} />
        <WritingSection variant={t.writingVariant} speedMul={t.writingSpeed} />
        <NowTeaser />
        <Footer />
      </main>

      {t.easterEggs && (
        <EasterEggs
          enabled={t.easterEggs}
          onChangelogToggle={() => setChangelogOpen((v) => !v)}
          onCoordsToggle={setCoordsVisible}
        />
      )}
      <ChangelogOverlay open={changelogOpen} onClose={() => setChangelogOpen(false)} />

      <TweaksPanel>
        <TweakSection label="Hero" />
        <TweakSelect
          label="Variant"
          value={t.heroVariant}
          options={[
            { value: 'statement', label: 'A · Statement' },
            { value: 'worklog',   label: 'B · Worklog' },
            { value: 'index',     label: 'C · Index' },
            { value: 'stack',     label: 'D · Stack' },
            { value: 'question',  label: 'E · Question' },
          ]}
          onChange={(v) => setTweak('heroVariant', v)}
        />

        <TweakSection label="Projects" />
        <TweakRadio
          label="Layout"
          value={t.projectsVariant}
          options={['asymmetric', 'rows', 'index']}
          onChange={(v) => setTweak('projectsVariant', v)}
        />

        <TweakSection label="Writing" />
        <TweakRadio
          label="Style"
          value={t.writingVariant}
          options={['marquee', 'list', 'bigthree']}
          onChange={(v) => setTweak('writingVariant', v)}
        />
        <TweakSlider
          label="Speed (× old marquee)"
          value={t.writingSpeed}
          min={1} max={20} step={0.5}
          onChange={(v) => setTweak('writingSpeed', v)}
        />

        <TweakSection label="Atmosphere" />
        <TweakToggle
          label="Easter eggs"
          value={t.easterEggs}
          onChange={(v) => setTweak('easterEggs', v)}
        />
        <TweakToggle
          label="Grain texture"
          value={t.grain}
          onChange={(v) => setTweak('grain', v)}
        />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
